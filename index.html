<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Pokédex Binder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>National Pokédex Binder</h1>
        
        <div id="search-container">
            <input type="text" id="search-bar" placeholder="Search by name or dex #...">
        </div>

        <div id="progress-container">
            <span id="progress-display">Collected: 0.0%</span>
            <span id="count-display">(0 / 0)</span>
        </div>
        <div id="controls">
            <button id="export-btn">Export Progress</button>
            <input type="file" id="import-file" accept=".json" hidden>
            <button id="import-btn">Import Progress</button>
        </div>
    </header>

    <main>
        <table id="pokedex-table">
            <thead>
                <tr>
                    <th>Have</th>
                    <th>Card #</th>
                    <th>Binder Page</th>
                    <th>Slot</th>
                    <th>Sprite</th>
                    <th>Name</th>
                    <th>Dex #</th>
                </tr>
            </thead>
            <tbody id="pokedex-body">
                <!-- Pokemon rows will be generated here by JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="script.js"></script>
</body>
</html>
