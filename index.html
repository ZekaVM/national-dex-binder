<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Pokédex Binder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Warning Banner for Missing Sprites -->
    <div id="warning-banner" style="display: none;">
        ⚠️ <strong>Warning:</strong> The following sprites could not be found locally: 
        <span id="missing-list"></span>
    </div>

    <header>
        <h1>National Pokédex Binder</h1>
        
        <div id="filter-controls">
            <input type="text" id="search-bar" placeholder="Search name or dex #...">
            
            <select id="gen-filter">
                <option value="all">All Generations</option>
                <option value="1">Gen 1</option>
                <option value="2">Gen 2</option>
                <option value="3">Gen 3</option>
                <option value="4">Gen 4</option>
                <option value="5">Gen 5</option>
                <option value="6">Gen 6</option>
                <option value="7">Gen 7</option>
                <option value="8">Gen 8</option>
                <option value="9">Gen 9</option>
            </select>

            <select id="status-filter">
                <option value="all">All Cards</option>
                <option value="collected">Collected Only</option>
                <option value="missing">Missing Only</option>
            </select>

            <select id="sort-filter">
                <option value="asc">Sort: Dex # (Asc)</option>
                <option value="desc">Sort: Dex # (Desc)</option>
            </select>
        </div>

        <div id="progress-container">
            <span id="progress-display">Collected: 0.0%</span>
            <span id="count-display">(0 / 0)</span>
        </div>
        <div id="controls">
            <button id="export-btn">Export Progress</button>
            <input type="file" id="import-file" accept=".json" hidden>
            <button id="import-btn">Import Progress</button>
        </div>

        <!-- Mobile-only toggle. Hidden on desktop via CSS. -->
        <button id="header-toggle" type="button"
                aria-expanded="true" aria-label="Toggle filters header"
                title="Toggle filters header">▲</button>
    </header>

    <main>
        <table id="pokedex-table">
            <thead>
                <tr>
                    <th>Have</th>
                    <th>Card #</th>
                    <th>Binder Page</th>
                    <th>Slot</th>
                    <th>Sprite</th>
                    <th>Name</th>
                    <th>Dex #</th>
                </tr>
            </thead>
            <tbody id="pokedex-body">
                <!-- Pokemon rows will be generated here by JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="script.js"></script>
</body>
</html>
